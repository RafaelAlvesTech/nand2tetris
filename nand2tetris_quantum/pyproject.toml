[project]
name = "nand2tetris-quantum"
version = "0.1.0"
description = "Portas lógicas quânticas com PennyLane e Qiskit"
authors = [
    {name = "RafaelAlvesTech", email = "rafaelpereiraalves@ufba.br"}
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pennylane>=0.41.0,<0.42.0",
    "pennylane-qiskit>=0.41.0,<0.42.0",
    "qiskit>=0.32,<1.3",
    "jupyter (>=1.1.1,<2.0.0)",
    "ipykernel (>=6.29.5,<7.0.0)",
    "pennylane-lightning[gpu] (>=0.41.0,<0.42.0)"
]

[tool.poetry]
packages = [{include = "nand2tetris_quantum", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
